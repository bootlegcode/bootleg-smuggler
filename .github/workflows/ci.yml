name: Linux supervisor
on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      # Ephemeral runners don't reuse incremental state; omit debug info to reduce linking work.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        working-directory: bootleg-smuggler
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: bootleg-smuggler
          persist-credentials: false
      - id: core
        run: |
          read -r revision < .github/bootleg-core.rev
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bootlegcode/bootleg-core
          ref: ${{ steps.core.outputs.revision }}
          path: bootleg-core
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy && rustup default 1.99.1
      - name: Verify release tag matches Cargo package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "bootleg-smuggler") | .version')
          if [[ "$RELEASE_TAG" != "v$version" || ! "$RELEASE_TAG" =~ ^v[A-Za-z0-9_.-]{1,127}$ ]]; then
            echo "Expected a valid Docker tag matching Cargo version v$version." >&2
            exit 1
          fi
      - run: cargo fmt --check
      - name: Cache crates.io downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/cache/index.crates.io-*
            ~/.cargo/registry/index/index.crates.io-*
          key: cargo-crates-io-v1-${{ runner.os }}-${{ runner.arch }}-smuggler-${{ hashFiles('bootleg-smuggler/Cargo.lock') }}
          restore-keys: cargo-crates-io-v1-${{ runner.os }}-${{ runner.arch }}-smuggler-
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and real Linux process tests (including orphan reaping)
        run: cargo test --locked --all-targets
      - name: Container build and Linux PID 1 TERM/KILL checks
        run: |
          export SMUGGLER_IMAGE="smuggler-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker image rm "$SMUGGLER_IMAGE" >/dev/null 2>&1 || true' EXIT
          docker build -f Dockerfile -t "$SMUGGLER_IMAGE" ..
          bash tests/docker-smoke.sh
